<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef0fb"/>
      <stop offset="1" stop-color="#d7dbf3"/>
    </linearGradient>
    <linearGradient id="moon1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c778"/>
      <stop offset="1" stop-color="#c8952f"/>
    </linearGradient>
    <linearGradient id="blanket1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f3690"/>
      <stop offset="1" stop-color="#0f1258"/>
    </linearGradient>
  </defs>

  <rect width="480" height="320" fill="url(#bg1)"/>

  <circle cx="404" cy="56" r="30" fill="url(#moon1)"/>
  <circle cx="392" cy="46" r="26" fill="#eef0fb" opacity="0.9"/>

  <circle cx="70" cy="55" r="2.5" fill="#c8952f"/>
  <circle cx="110" cy="95" r="2" fill="#c8952f"/>
  <circle cx="150" cy="40" r="1.8" fill="#c8952f"/>
  <circle cx="330" cy="150" r="2" fill="#c8952f"/>
  <circle cx="360" cy="190" r="1.6" fill="#c8952f"/>

  <ellipse cx="205" cy="275" rx="150" ry="14" fill="#0c0e46" opacity="0.08"/>

  <!-- headboard -->
  <rect x="80" y="150" width="16" height="110" rx="6" fill="#0c0e46"/>
  <rect x="70" y="140" width="36" height="24" rx="10" fill="#2f3690"/>

  <!-- bed frame -->
  <rect x="80" y="235" width="250" height="18" rx="6" fill="#090b35"/>
  <rect x="70" y="253" width="18" height="34" rx="3" fill="#090b35"/>
  <rect x="322" y="253" width="18" height="34" rx="3" fill="#090b35"/>

  <!-- mattress + blanket -->
  <rect x="90" y="205" width="230" height="34" rx="14" fill="#f4f1ff"/>
  <path d="M90 218 q120 -22 230 0 v21 q-120 18 -230 0z" fill="url(#blanket1)"/>

  <!-- pillow -->
  <ellipse cx="128" cy="205" rx="34" ry="18" fill="#ffffff"/>
  <ellipse cx="128" cy="205" rx="34" ry="18" fill="#eef0fb" opacity="0.6"/>

  <!-- sleeping character -->
  <circle cx="140" cy="196" r="19" fill="#e0b25a"/>
  <path d="M124 190 q16 -14 32 0 q2 8 -4 8 q-12 -8 -24 0 q-6 0 -4 -8z" fill="#0c0e46"/>
  <path d="M132 200 q8 4 16 0" stroke="#8a5a1e" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- phone set aside, screen off -->
  <rect x="345" y="240" width="30" height="50" rx="6" fill="#090b35"/>
  <rect x="350" y="247" width="20" height="34" rx="2" fill="#2f3690"/>
  <circle cx="360" cy="285" r="1.6" fill="#eef0fb"/>

  <!-- Zzz -->
  <text x="205" y="150" font-family="sans-serif" font-size="22" fill="#0f1258" font-weight="bold">Z</text>
  <text x="225" y="128" font-family="sans-serif" font-size="17" fill="#2f3690" font-weight="bold">z</text>
  <text x="240" y="112" font-family="sans-serif" font-size="13" fill="#2f3690" font-weight="bold">z</text>
</svg>
