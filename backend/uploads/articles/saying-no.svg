  <rect width="480" height="320" fill="url(#bg2)"/>
  <ellipse cx="165" cy="295" rx="90" ry="14" fill="#0c0e46" opacity="0.08"/>

  <!-- character body -->
  <path d="M110 300 q-6 -95 55 -108 q55 12 55 108z" fill="url(#body2)"/>
  <circle cx="165" cy="140" r="36" fill="#e0b25a"/>
